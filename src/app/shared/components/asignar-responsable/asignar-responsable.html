<h2 mat-dialog-title>Asignar responsable</h2>

<div mat-dialog-content class="assign-reviewer-form">
  @if (data.asignaciones.length > 1) {
    <div>
      <label for="historial-aprobacion" class="form-label">Aprobación pendiente:</label>
      <select
        id="historial-aprobacion"
        class="form-select"
        required
        [(ngModel)]="historyId"
        (ngModelChange)="userId = null"
      >
        <option [ngValue]="null" disabled>Seleccione el rol pendiente</option>
        @for (asignacion of data.asignaciones; track asignacion.history_id) {
          <option [ngValue]="asignacion.history_id">
            Orden {{ asignacion.step_order }} · {{ asignacion.role_name }}
          </option>
        }
      </select>
    </div>
  }

  <div>
    <label for="usuario-responsable" class="form-label">Asignar a:</label>
    <select
      id="usuario-responsable"
      class="form-select"
      required
      [(ngModel)]="userId"
      [disabled]="!asignacionSeleccionada || usuariosDisponibles.length === 0"
    >
      <option [ngValue]="null" disabled>Seleccione un usuario</option>
      @for (usuario of usuariosDisponibles; track usuario.user_id) {
        <option [ngValue]="usuario.user_id">{{ usuario.name }} ({{ usuario.email }})</option>
      }
    </select>
  </div>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="guardar()"
    [disabled]="historyId === null || userId === null"
  >
    Guardar
  </button>
</div>
