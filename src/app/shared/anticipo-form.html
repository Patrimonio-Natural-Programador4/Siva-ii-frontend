<div class="drawer-container">
  <div class="drawer-header">
    <h2 class="d-flex align-items-center justify-content-between m-t-0 f-w-400 m-b-0">
      <span>Registrar anticipo</span>
      <button mat-icon-button (click)="cancelar()" type="button">
        <mat-icon>close</mat-icon>
      </button>
    </h2>
  </div>
  <div class="drawer-content">
    <form novalidate #f="ngForm">
        <div class="row">
            <div class="col-12 col-md-12 col-lg-12">
                <label for="expense_advance_concept_id" class="form-label">Concepto*</label>
                <select id="expense_advance_concept_id" class="form-select"
                    #concepto="ngModel" required 
                  [(ngModel)]="anticipo.expense_advance_concept_id"
                  name="expense_advance_concept_id">
                    <option [ngValue]="null" [disabled]="true">Seleccione el concepto</option>
                    @for (data of listados[4]?.lista_generica ?? []; track data.identity) {
                        <option [ngValue]="data.identity">{{ data.valor }}
                        </option>
                    }
                </select>
                @if (concepto.invalid && (concepto.dirty || concepto.touched)) {
                    <div class="invalid-feedback d-block">
                        <span class="text-danger">Este campo es requerido.</span>
                    </div>
                }

            </div>
            <div class="col-12 col-md-12 col-lg-12">
                <label for="amount" class="form-label">Valor del anticipo</label>
                <br>
                <input type="number" class="form-control" id="amount"
                    name="amount" placeholder="Valor del anticipo"
                    [(ngModel)]="anticipo.amount"
                    #amount="ngModel"
                    [class.is-invalid]="amount.invalid && (amount.dirty || amount.touched)"/>
            </div>
            <div class="col-12 col-md-12 col-lg-12">
                <label for="observations" class="form-label">
                  Observaciones{{ anticipo.expense_advance_concept_id === 4 ? '*' : '' }}
                </label>
                <br>
                <textarea id="observations" class="form-control" rows="2"
                                        #observations="ngModel" placeholder="Observaciones"
                                        [(ngModel)]="anticipo.observations" name="observations"
                                        [required]="anticipo.expense_advance_concept_id === 4"
                                        [class.is-invalid]="observations.invalid && (observations.dirty || observations.touched)"
                                        maxlength="255"></textarea>
                            @if (observations.invalid && (observations.dirty || observations.touched)) {
                              <div class="invalid-feedback d-block">
                                <span class="text-danger">Este campo es requerido para el concepto seleccionado.</span>
                              </div>
                            }
            </div>
            <div class="col-12 col-md-6 col-lg-6">
                <!-- <span class="text-danger ng-star-inserted" *ngIf="errorEnanticipo" [innerHTML]="error_anticipo"></span> -->
            </div>
        </div>
    </form>
  </div>
  <div class="drawer-footer">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="button" (click)="guardar()" [disabled]="!f.valid">
        Guardar anticipo
    </button>
  </div>
</div>
