<page-header />

<div class="row">
  <div class="col-sm-12">
    <mat-card class="app-data-card viajes-calendar-card">
      <mat-card-header class="app-data-card__header">
        <mat-card-title>Calendario de viajes</mat-card-title>
      </mat-card-header>

      <mat-card-content class="app-data-card__content">
        <div class="app-data-card__toolbar viajes-calendar-toolbar">
          <button mat-stroked-button type="button" (click)="volverListado()">
            <mat-icon>arrow_back</mat-icon>
            Volver al listado
          </button>
        </div>

        <div class="calendar-state" *ngIf="isLoading">Cargando viajes...</div>

        <full-calendar [options]="calendarOptions"></full-calendar>
      </mat-card-content>
    </mat-card>
  </div>
</div>
