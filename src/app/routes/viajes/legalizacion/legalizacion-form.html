<div class="drawer-container">
  <div class="drawer-header">
    <h2 class="d-flex align-items-center justify-content-between m-t-0 f-w-400 m-b-0">
      <span>{{ isEdit ? 'Modificar factura' : 'Registrar factura' }}</span>
      <button mat-icon-button (click)="cancelar()" type="button">
        <mat-icon>close</mat-icon>
      </button>
    </h2>
  </div>

  <div class="drawer-content position-relative">
    <div
      *ngIf="isLoading"
      class="d-flex flex-column align-items-center justify-content-center py-5"
    >
      <mat-spinner diameter="40"></mat-spinner>
      <span class="mt-3 text-muted">Cargando información de la legalización...</span>
    </div>

    <form novalidate #f="ngForm" [hidden]="isLoading">
      <div class="row">
        <div class="col-12 col-md-6 mb-3">
          <label for="check_date" class="form-label">Fecha de factura*</label>
          <mat-form-field class="w-100 small" appearance="outline">
            <input
              matInput
              [matDatepicker]="pickerCheck"
              (click)="pickerCheck.open()"
              [(ngModel)]="legalizacion.check_date"
              name="check_date"
              id="check_date"
              required
            />
            <mat-datepicker-toggle matSuffix [for]="pickerCheck"></mat-datepicker-toggle>
            <mat-datepicker #pickerCheck></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="check_number" class="form-label">Número de factura o Documento Soporte</label>
          <input
            type="text"
            class="form-control"
            id="check_number"
            name="check_number"
            [(ngModel)]="legalizacion.check_number"
            maxlength="50"
          />
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="beneficiary" class="form-label">Beneficiario*</label>
          <input
            type="text"
            class="form-control"
            id="beneficiary"
            name="beneficiary"
            [(ngModel)]="legalizacion.beneficiary"
            required
            maxlength="255"
            #beneficiary="ngModel"
            [class.is-invalid]="beneficiary.invalid && (beneficiary.dirty || beneficiary.touched)"
          />
          <div class="invalid-feedback">Este campo es requerido.</div>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="nit_beneficiary" class="form-label">NIT / CC*</label>
          <input
            type="text"
            class="form-control"
            id="nit_beneficiary"
            name="nit_beneficiary"
            [(ngModel)]="legalizacion.nit_beneficiary"
            required
            maxlength="20"
            #nit="ngModel"
            [class.is-invalid]="nit.invalid && (nit.dirty || nit.touched)"
          />
          <div class="invalid-feedback">Este campo es requerido.</div>
        </div>

        <div class="col-12 col-md-12 mb-3">
          <label for="observations_outlay" class="form-label">Descripción del gasto</label>
          <textarea
            class="form-control"
            id="observations_outlay"
            name="observations_outlay"
            [(ngModel)]="legalizacion.observations_outlay"
            rows="2"
          ></textarea>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="regimen_type_id" class="form-label">Régimen Contributivo*</label>
          <select
            id="regimen_type_id"
            class="form-select"
            name="regimen_type_id"
            [(ngModel)]="legalizacion.regimen_type_id"
            required
            #regimen="ngModel"
            [class.is-invalid]="regimen.invalid && (regimen.dirty || regimen.touched)"
          >
            <option [ngValue]="null" [disabled]="true">Seleccione un régimen</option>
            <option *ngFor="let reg of regimenTypes" [ngValue]="reg.id">{{ reg.name }}</option>
          </select>
          <div class="invalid-feedback">Este campo es requerido.</div>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="subtotal" class="form-label">Subtotal*</label>
          <input
            type="number"
            class="form-control"
            id="subtotal"
            name="subtotal"
            [(ngModel)]="legalizacion.subtotal"
            (ngModelChange)="calcularRetencion()"
            required
            step="0.01"
            min="0"
          />
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="iva" class="form-label">IVA*</label>
          <input
            type="number"
            class="form-control"
            id="iva"
            name="iva"
            [(ngModel)]="legalizacion.iva"
            (ngModelChange)="calcularTotal()"
            required
            step="0.01"
            min="0"
          />
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="retention_porcentage" class="form-label">
            Porcentaje de Retención (Ej 2.5)*
          </label>
          <input
            type="number"
            class="form-control"
            id="retention_porcentage"
            name="retention_porcentage"
            [(ngModel)]="legalizacion.retention_porcentage"
            (ngModelChange)="calcularRetencion()"
            required
            step="0.01"
            min="0"
            max="100"
          />
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="retention" class="form-label">Retención*</label>
          <input
            type="number"
            class="form-control"
            id="retention"
            name="retention"
            [value]="legalizacion.retention"
            readonly
          />
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label for="amount_paid" class="form-label">Valor Cancelado*</label>
          <input
            type="number"
            class="form-control"
            id="amount_paid"
            name="amount_paid"
            [value]="legalizacion.amount_paid"
            readonly
          />
        </div>

        <div class="col-12 col-md-12 mb-3">
          <label for="observations" class="form-label">Observaciones</label>
          <textarea
            class="form-control"
            id="observations"
            name="observations"
            [(ngModel)]="legalizacion.observations"
            rows="2"
          ></textarea>
        </div>
      </div>
    </form>
  </div>

  <div class="drawer-footer">
    <button mat-button type="button" (click)="cancelar()">Cerrar</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="guardar()"
      [disabled]="!f.valid || isLoading || isSaving"
    >
      {{ isEdit ? 'Guardar cambios' : 'Guardar legalización' }}
    </button>
  </div>
</div>
