<div class="drawer-container">
  <div class="drawer-header">
    <h2 class="d-flex align-items-center justify-content-between m-t-0 f-w-400 m-b-0">Agregar Documento Asociado
      <button mat-icon-button (click)="cerrar()">
        <mat-icon>close</mat-icon>
      </button>
    </h2>
  </div>

  <div class="drawer-content position-relative">
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="row">
      <div class="col-sm-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Tipo de Adjunto</mat-label>
          <mat-select formControlName="document_type_id">
            <mat-option *ngFor="let tipo of tiposDocumento" [value]="tipo.id">
              {{ tipo.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('document_type_id')?.hasError('required')">
            Debe seleccionar el tipo de adjunto.
          </mat-error>
        </mat-form-field>
      </div>
      
      <div class="col-sm-12 mt-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Observaciones</mat-label>
          <textarea matInput formControlName="observaciones" rows="4"></textarea>
          <mat-error *ngIf="form.get('observaciones')?.hasError('required')">
            Las observaciones son requeridas.
          </mat-error>
          <mat-error *ngIf="form.get('observaciones')?.hasError('maxlength')">
            Máximo 500 caracteres.
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col-sm-12 mt-3">
        <div class="file-upload-container p-3 border rounded">
          <p class="mb-2"><strong>Archivo (Solo PDF, máx. 10MB):</strong></p>
          <input 
            type="file" 
            (change)="onFileSelected($event)" 
            accept=".pdf"
            class="form-control"
          >
          <div *ngIf="fileName" class="mt-2 text-success">
            <mat-icon inline="true">check_circle</mat-icon> {{ fileName }} seleccionado.
          </div>
        </div>
      </div>
    </div>
  </form>
  </div>
  <div class="drawer-footer d-flex justify-content-end p-3 border-top">
      <button mat-stroked-button color="warn" (click)="cerrar()" class="me-2" [disabled]="isSaving">
        Cancelar
      </button>
      <button mat-flat-button color="primary" (click)="guardar()" [disabled]="isSaving">
        {{ isSaving ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
</div>
