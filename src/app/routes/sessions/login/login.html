<div class="login-wrapper">
  <!-- Left Side: Clean Hero Nature Background -->
  <div class="login-left"></div>

  <!-- Right Side: Main Login Panel -->
  <div class="login-right">
    <div class="login-card-content">
      <div class="main-logo-container">
        <img src="images/logos/logoSIVA.png" alt="SIVA II" class="logo-main">
      </div>

      <!-- <div class="welcome-text">
        <h1 class="welcome-title">Bienvenido</h1>
        <p class="welcome-subtitle">A nuestro sistema de información</p>
      </div> -->

      <div class="action-container">
        <button class="btn-login-sso" (click)="loginRedirect()">
          <div class="microsoft-logo-icon">
            <span class="square red"></span>
            <span class="square green"></span>
            <span class="square blue"></span>
            <span class="square yellow"></span>
          </div>
          <span>INICIA SESIÓN CON SU CORREO</span>
        </button>
      </div>

      <!-- Institutional and Supporting Logos -->
      <div class="logos-container">
        <div class="institutional-logos">
          <img src="images/logos/logo_patrimonio.png" alt="Patrimonio Natural" class="logo-inst">
          <img src="images/logos/minambiente.png" alt="Minambiente" class="logo-inst">
          <img src="images/logos/sivarem.png" alt="SIVA REM" class="logo-inst">
        </div>

        <div class="support-logos-section">
          <p class="support-label">Con el apoyo de</p>
          <div class="support-logos-row">
            <img src="images/logos/Noruega.png" alt="Noruega" class="logo-support">
            <img src="images/logos/UK_Government_Overseas_Logo.svg.png" alt="UK Government"
              class="logo-support">
            <img src="images/logos/kfw-rgb.png" alt="KfW" class="logo-support">
            <img src="images/logos/logo_coop_alemana.png" alt="Cooperación Alemana"
              class="logo-support">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
