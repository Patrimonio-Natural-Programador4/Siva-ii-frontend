
name: Deploy Frontend

on:
  push:
    branches:
      - developp
      - production

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, siva-ii-frontend]

    # Protección mediante GitHub Environments
    environment:
      name: ${{ github.ref_name == 'production' && 'production' || 'testing' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        run: |
          if [ "$GITHUB_REF_NAME" = "production" ]; then
            echo "APP_PATH=/opt/apps/siva2" >> "$GITHUB_ENV"
            echo "CONTAINER=siva2-front" >> "$GITHUB_ENV"
            echo "PORT=8083" >> "$GITHUB_ENV"
            echo "BUILD_CONFIGURATION=productionServer" >> "$GITHUB_ENV"

          elif [ "$GITHUB_REF_NAME" = "developp" ]; then
            echo "APP_PATH=/opt/apps/devsiva2" >> "$GITHUB_ENV"
            echo "CONTAINER=devsiva2-front" >> "$GITHUB_ENV"
            echo "PORT=8081" >> "$GITHUB_ENV"
            echo "BUILD_CONFIGURATION=production" >> "$GITHUB_ENV"

          else
            echo "Branch not authorized"
            exit 1
          fi

      - name: Verify environment
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Destination: $APP_PATH"
          echo "Container: $CONTAINER"
          echo "Port: $PORT"
          echo "Angular configuration: $BUILD_CONFIGURATION"

          docker --version
          docker compose version
          rsync --version

      - name: Sync frontend
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            ./ "$APP_PATH/front/"

      - name: Verify files
        run: |
          test -f "$APP_PATH/front/Dockerfile"
          test -f "$APP_PATH/front/package.json"
          test -f "$APP_PATH/front/angular.json"
          test -f "$APP_PATH/front/src/environments/environment.ts"

      - name: Build frontend
        run: |
          cd "$APP_PATH"

          docker compose build --no-cache \
            --build-arg BUILD_CONFIGURATION="$BUILD_CONFIGURATION" \
            front

      - name: Deploy frontend
        run: |
          cd "$APP_PATH"

          docker compose up -d --force-recreate front

      - name: Verify container
        run: |
          docker ps --filter "name=$CONTAINER"

          docker exec "$CONTAINER" sh -c \
            "test -f /usr/share/nginx/html/index.html"

      - name: Verify HTTP response
        run: |
          curl -f "http://127.0.0.1:$PORT/"
