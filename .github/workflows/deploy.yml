name: Deploy Frontend - Developp

on:
  push:
    branches:
      - developp

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, siva-ii-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Workspace: $GITHUB_WORKSPACE"
          docker --version
          docker compose version
          rsync --version

      - name: Sync frontend
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='dist' \
            "$GITHUB_WORKSPACE/" \
            /opt/apps/devsiva2/front/

      - name: Build frontend
        run: |
          cd /opt/apps/devsiva2
          docker compose build --no-cache front

      - name: Restart frontend
        run: |
          cd /opt/apps/devsiva2
          docker compose up -d front

      - name: Verify deployment
        run: |
          docker ps --filter "name=devsiva2-front"
          docker exec devsiva2-front sh -c "ls -lah /usr/share/nginx/html"