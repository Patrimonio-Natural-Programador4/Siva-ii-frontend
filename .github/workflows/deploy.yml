name: Deploy Frontend - Developp

on:
  push:
    branches:
      - developp

jobs:
  deploy:
    runs-on: [self-hosted, siva-ii-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show workspace
        run: |
          echo "Workspace:"
          pwd
          ls -la

      - name: Sync frontend to server
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ /opt/apps/devsiva2/front/

      - name: Verify deployment files
        run: |
          cd /opt/apps/devsiva2/front
          echo "Contenido:"
          ls -la
          echo "Dockerfile:"
          ls -l Dockerfile

      - name: Build frontend
        run: |
          cd /opt/apps/devsiva2
          docker compose build --no-cache front

      - name: Deploy frontend
        run: |
          cd /opt/apps/devsiva2
          docker compose up -d --force-recreate front

      - name: Verify container
        run: |
          docker ps --filter "name=devsiva2-front"